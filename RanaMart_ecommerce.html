<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RanaMart — Online Shop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f7fb;color:#172033}
header{background:#0f4c5c;color:white;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:800}.logo span{color:#ffd166}
.cart{background:#ffd166;color:#172033;border:0;border-radius:22px;padding:10px 16px;font-weight:700;cursor:pointer}
.hero{padding:55px 5%;background:linear-gradient(135deg,#0f4c5c,#187a8f);color:white}
.hero h1{font-size:clamp(30px,6vw,52px);margin-bottom:12px}.hero p{font-size:18px;max-width:600px;line-height:1.6}
.container{max-width:1100px;margin:auto;padding:30px 5%}
.search{width:100%;padding:14px 18px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-bottom:25px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #00000012;padding-bottom:16px}
.pic{height:180px;background:#e8f2f4;display:flex;align-items:center;justify-content:center;font-size:55px}
.card h3,.card p{padding:0 16px}.card h3{margin-top:14px}.price{font-weight:800;color:#0f7a52;font-size:19px;margin:8px 0 12px}
.add{margin:0 16px;width:calc(100% - 32px);border:0;background:#0f4c5c;color:#fff;padding:11px;border-radius:10px;cursor:pointer;font-weight:700}
section h2{margin-bottom:18px}
footer{margin-top:35px;background:#172033;color:white;text-align:center;padding:28px 5%;line-height:1.8}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px}
.box{background:white;max-width:500px;margin:5vh auto;padding:25px;border-radius:18px;max-height:90vh;overflow:auto}
.close{float:right;border:0;background:none;font-size:25px;cursor:pointer}
input,textarea,select{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ddd;border-radius:9px}
.submit{width:100%;padding:13px;border:0;border-radius:10px;background:#0f7a52;color:white;font-weight:700;cursor:pointer}
.item{padding:10px 0;border-bottom:1px solid #eee}
@media(max-width:600px){header{padding:13px 4%}.hero{padding:40px 5%}.pic{height:150px}}
</style>
</head>
<body>
<header>
  <div class="logo">Rana<span>Mart</span></div>
  <button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<div class="hero">
  <h1>Shopping made simple.</h1>
  <p>পছন্দের পণ্য ঘরে বসে অর্ডার করুন। সহজ অর্ডার, দ্রুত যোগাযোগ এবং Cash on Delivery সুবিধা।</p>
</div>

<main class="container">
  <input id="search" class="search" placeholder="🔎 পণ্য খুঁজুন..." oninput="render()">
  <section>
    <h2>জনপ্রিয় পণ্য</h2>
    <div id="products" class="products"></div>
  </section>
</main>

<footer>
  <strong>RanaMart</strong><br>
  Customer Support: <a href="tel:01313862097" style="color:#ffd166">01313862097</a><br>
  © 2026 RanaMart. All rights reserved.
</footer>

<div id="modal" class="modal">
  <div class="box">
    <button class="close" onclick="closeModal()">×</button>
    <h2 id="modalTitle">আপনার অর্ডার</h2>
    <div id="cartItems"></div>
    <form id="orderForm">
      <input id="name" required placeholder="আপনার নাম">
      <input id="phone" required type="tel" placeholder="মোবাইল নম্বর">
      <textarea id="address" required placeholder="সম্পূর্ণ ঠিকানা"></textarea>
      <select id="payment"><option>Cash on Delivery</option></select>
      <button class="submit">অর্ডার কনফার্ম করুন</button>
    </form>
  </div>
</div>

<script>
const products=[
 {id:1,name:"Smart Watch",price:1290,icon:"⌚"},
 {id:2,name:"Wireless Earbuds",price:990,icon:"🎧"},
 {id:3,name:"Premium Backpack",price:850,icon:"🎒"},
 {id:4,name:"LED Desk Lamp",price:650,icon:"💡"},
 {id:5,name:"Power Bank",price:1190,icon:"🔋"},
 {id:6,name:"Bluetooth Speaker",price:1450,icon:"🔊"}
];
let cart=[];
function money(n){return "৳"+n.toLocaleString("en-BD")}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>p.name.toLowerCase().includes(q));
 document.getElementById("products").innerHTML=list.map(p=>`
 <article class="card">
   <div class="pic">${p.icon}</div>
   <h3>${p.name}</h3>
   <p class="price">${money(p.price)}</p>
   <button class="add" onclick="add(${p.id})">Add to Cart</button>
 </article>`).join("");
}
function add(id){cart.push(products.find(p=>p.id===id));updateCount();alert("পণ্যটি Cart-এ যোগ হয়েছে।")}
function updateCount(){document.getElementById("count").textContent=cart.length}
function openCart(){
 document.getElementById("modalTitle").textContent=cart.length?"আপনার Cart":"Cart খালি";
 document.getElementById("cartItems").innerHTML=cart.length?
 cart.map((p,i)=>`<div class="item">${p.name} — ${money(p.price)} <button onclick="removeItem(${i})">×</button></div>`).join("")+
 `<p style="margin:15px 0;font-weight:800">মোট: ${money(cart.reduce((s,p)=>s+p.price,0))}</p>`:
 "<p style='margin:20px 0'>আপনার Cart-এ কোনো পণ্য নেই।</p>";
 document.getElementById("orderForm").style.display=cart.length?"block":"none";
 document.getElementById("modal").style.display="block";
}
function removeItem(i){cart.splice(i,1);updateCount();openCart()}
function closeModal(){document.getElementById("modal").style.display="none"}
document.getElementById("orderForm").addEventListener("submit",e=>{
 e.preventDefault();
 if(!cart.length)return;
 const total=cart.reduce((s,p)=>s+p.price,0);
 const items=cart.map(p=>p.name).join(", ");
 const msg=`নতুন অর্ডার%0Aনাম: ${encodeURIComponent(name.value)}%0Aফোন: ${encodeURIComponent(phone.value)}%0Aঠিকানা: ${encodeURIComponent(address.value)}%0Aপণ্য: ${encodeURIComponent(items)}%0Aমোট: ${encodeURIComponent(money(total))}`;
 window.open(`https://wa.me/8801313862097?text=${msg}`,"_blank");
});
render();
</script>
</body>
</html>
